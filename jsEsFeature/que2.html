<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Form Validator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
    }
    form {
        background: #fff;
        padding: 20px;
        width: 350px;
        margin: auto;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0 5px;
        border: 2px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }
    input.valid {
        border-color: green;
    }
    input.invalid {
        border-color: red;
    }
    .error {
        color: red;
        font-size: 13px;
        height: 14px;
    }
    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #333;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }
</style>
</head>

<body>

<h2 style="text-align:center;">Student Registration Form</h2>

<form id="studentForm">
    <label>Name</label>
    <input type="text" id="name">
    <div class="error" id="nameError"></div>

    <label>Email</label>
    <input type="text" id="email">
    <div class="error" id="emailError"></div>

    <label>Phone</label>
    <input type="text" id="phone">
    <div class="error" id="phoneError"></div>

    <label>Password</label>
    <input type="password" id="password">
    <div class="error" id="passwordError"></div>

    <button type="submit">Register</button>
</form>

<script>
    function validate(input, regex, message, errorElement) {
        if (regex.test(input.value)) {
            input.classList.add("valid");
            input.classList.remove("invalid");
            errorElement.textContent = "";
            return true;
        } else {
            input.classList.add("invalid");
            input.classList.remove("valid");
            errorElement.textContent = message;
            return false;
        }
    }

    document.getElementById("studentForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const name = document.getElementById("name");
        const email = document.getElementById("email");
        const phone = document.getElementById("phone");
        const password = document.getElementById("password");

        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const phoneError = document.getElementById("phoneError");
        const passwordError = document.getElementById("passwordError");

        const nameValid = validate(name, /^[A-Za-z ]+$/, "Name must contain only alphabets", nameError);
        const emailValid = validate(email, /^[^\s@]+@[^\s@]+\.[^\s@]+$/, "Enter a valid email", emailError);
        const phoneValid = validate(phone, /^\d{10}$/, "Phone must be exactly 10 digits", phoneError);
        const passwordValid = validate(
            password,
            /^(?=.*[A-Z])(?=.*[0-9])(?=.*[\W_]).+$/,
            "Password must contain 1 uppercase, 1 number, 1 special character",
            passwordError
        );

        if (nameValid && emailValid && phoneValid && passwordValid) {
            alert("Registration Successful!");
        }
    });
</script>

</body>
</html>
