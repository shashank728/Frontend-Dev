<!DOCTYPE html>
<html>
<head>
    <title>Q2 Operations</title>
</head>
<body>

<h2>Q2: applyOperation</h2>
<button onclick="runQ2()">Run</button>

<pre id="out"></pre>

<script>
function applyOperation(numbers, operation) {
    const arr = [];
    for (let n of numbers) {
        arr.push(operation(n));
    }
    return arr;
}

function runQ2() {
    const nums = [1,2,3,4];
    const doubled = applyOperation(nums, function(n){ return n*2 });
    const squared = applyOperation(nums, function(n){ return n*n });

    document.getElementById("out").textContent =
        "Doubled: " + doubled.join(", ") +
        "\nSquared: " + squared.join(", ");
}
</script>

</body>
</html>
